<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>성심당 같이 사자 🍞</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans KR', -apple-system, sans-serif; }
    body { background-color: #fffbeb; }
    .item-card { transition: all 0.12s ease; }
    .item-card:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .item-selected { background: linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%) !important; }
    .slide-up { animation: slideUp 0.25s ease; }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .live-dot { animation: livePulse 1.8s infinite; }
    @keyframes livePulse { 0%,100% { opacity:1;transform:scale(1); } 50% { opacity:0.5;transform:scale(0.8); } }
    input[type=number] { -moz-appearance:textfield; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }
    .no-scrollbar::-webkit-scrollbar { display:none; }
    .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
    @keyframes highlightFlash {
      0%   { transform: scale(1); background: inherit; box-shadow: none; }
      20%  { transform: scale(1.03); background: #fef08a; box-shadow: 0 6px 24px rgba(251,191,36,0.45); }
      70%  { transform: scale(1.03); background: #fef08a; box-shadow: 0 6px 24px rgba(251,191,36,0.45); }
      100% { transform: scale(1); background: inherit; box-shadow: none; }
    }
    .highlight-flash { animation: highlightFlash 1.1s cubic-bezier(0.34,1.56,0.64,1); }
    ::-webkit-scrollbar { width:3px; height:3px; }
    ::-webkit-scrollbar-thumb { background:#fbbf24; border-radius:2px; }
    #main-screen { height:100dvh; }
    .modal-sheet { transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    .hidden-item { opacity: 0.45; }
    .tag-badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; font-weight: 700; }
  </style>
</head>
<body>

<!-- ========== LANDING ========== -->
<div id="landing-screen" class="min-h-screen flex flex-col items-center justify-center p-4 py-10">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8 slide-up">
      <div class="text-7xl mb-3">🍞</div>
      <h1 class="text-3xl font-black text-amber-900 tracking-tight">성심당 같이 사자!</h1>
      <p class="text-amber-600 mt-2 text-sm">친구들과 빵 목록을 함께 골라봐요</p>
    </div>
    <div class="bg-white rounded-3xl shadow-xl p-6 space-y-5 slide-up">
      <div>
        <label class="block text-xs font-bold text-amber-700 mb-1.5 uppercase tracking-wide">내 이름</label>
        <input id="input-name" type="text" placeholder="예) 홍길동" maxlength="10" autocomplete="off"
          class="w-full border-2 border-amber-100 rounded-2xl px-4 py-3 text-gray-800 focus:outline-none focus:border-amber-400 transition text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-amber-700 mb-1.5 uppercase tracking-wide">예산</label>
        <div class="relative">
          <input id="input-budget" type="number" placeholder="30000" min="0" step="1000"
            class="w-full border-2 border-amber-100 rounded-2xl px-4 py-3 pr-12 text-gray-800 focus:outline-none focus:border-amber-400 transition text-sm">
          <span class="absolute right-4 top-1/2 -translate-y-1/2 text-amber-500 font-bold text-sm">원</span>
        </div>
        <div class="flex gap-2 mt-2">
          <button onclick="setBudgetPreset(10000)" class="flex-1 text-xs bg-amber-50 hover:bg-amber-100 text-amber-700 py-1.5 rounded-xl font-bold transition">1만</button>
          <button onclick="setBudgetPreset(20000)" class="flex-1 text-xs bg-amber-50 hover:bg-amber-100 text-amber-700 py-1.5 rounded-xl font-bold transition">2만</button>
          <button onclick="setBudgetPreset(30000)" class="flex-1 text-xs bg-amber-50 hover:bg-amber-100 text-amber-700 py-1.5 rounded-xl font-bold transition">3만</button>
          <button onclick="setBudgetPreset(50000)" class="flex-1 text-xs bg-amber-50 hover:bg-amber-100 text-amber-700 py-1.5 rounded-xl font-bold transition">5만</button>
        </div>
      </div>
      <hr class="border-amber-100">
      <button onclick="createRoom()"
        class="w-full bg-amber-400 hover:bg-amber-500 active:bg-amber-600 text-white font-black py-4 rounded-2xl transition text-base shadow-md shadow-amber-200">
        🎉 새 방 만들기
      </button>
      <div class="flex items-center gap-3">
        <hr class="flex-1 border-amber-100">
        <span class="text-amber-300 text-xs font-bold">또는</span>
        <hr class="flex-1 border-amber-100">
      </div>
      <div class="flex gap-2">
        <input id="input-roomcode" type="text" placeholder="방 코드 입력" maxlength="6"
          class="flex-1 border-2 border-amber-100 rounded-2xl px-4 py-3 text-center font-mono font-black text-lg tracking-widest text-amber-900 focus:outline-none focus:border-amber-400 transition uppercase"
          oninput="this.value=this.value.toUpperCase()">
        <button onclick="joinRoom()"
          class="bg-amber-100 hover:bg-amber-200 active:bg-amber-300 text-amber-800 font-black px-5 rounded-2xl transition text-sm">
          참여
        </button>
      </div>
      <p id="landing-error" class="text-red-400 text-sm text-center font-bold hidden"></p>
    </div>
    <p class="text-center text-amber-300 text-xs mt-5">※ 메뉴 가격은 실제와 다를 수 있습니다</p>
  </div>
</div>

<!-- ========== MAIN SCREEN ========== -->
<div id="main-screen" class="hidden flex flex-col overflow-hidden">
  <!-- Header -->
  <div class="bg-amber-400 text-white px-4 flex-shrink-0" style="padding-top: max(env(safe-area-inset-top),12px); padding-bottom:12px;">
    <div class="flex items-start justify-between mb-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="font-black text-lg">🍞 성심당</span>
          <span id="conn-dot" class="live-dot w-2 h-2 rounded-full bg-white/40 inline-block"></span>
        </div>
        <div class="flex items-center gap-2 mt-0.5">
          <span class="text-amber-100 text-xs">방 코드</span>
          <button id="room-code-btn" onclick="copyShareLink()"
            class="bg-white/20 hover:bg-white/30 font-mono font-black text-sm px-3 py-0.5 rounded-lg tracking-widest transition active:scale-95">
            ------
          </button>
          <span id="copy-toast" class="text-xs text-amber-100 opacity-0 transition-all duration-300">✓ 복사됨</span>
        </div>
      </div>
      <div class="flex items-center gap-2 mt-1">
        <div id="users-avatars" class="flex -space-x-2"></div>
        <button onclick="openMenuModal()"
          class="w-9 h-9 bg-white/20 hover:bg-white/30 rounded-xl flex items-center justify-center text-base transition active:scale-95"
          title="메뉴 관리">✏️</button>
        <button onclick="leaveRoom()"
          class="w-9 h-9 bg-white/20 hover:bg-white/30 rounded-xl flex items-center justify-center text-base transition active:scale-95"
          title="나가기 (이름 변경)">🚪</button>
      </div>
    </div>
    <!-- Budget bar -->
    <div class="bg-white/15 rounded-2xl p-3">
      <div class="flex justify-between items-baseline mb-1.5">
        <span class="text-sm font-bold">내 합계</span>
        <span id="my-total-display" class="text-base font-black">0원</span>
      </div>
      <div class="bg-white/25 rounded-full h-2 overflow-hidden">
        <div id="budget-bar" class="h-full rounded-full bg-white transition-all duration-500" style="width:0%"></div>
      </div>
      <div class="flex justify-between mt-1.5">
        <span id="budget-status" class="text-xs text-amber-100"></span>
        <span id="my-budget-display" class="text-xs text-amber-100">예산: 설정 안 함</span>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="bg-white border-b border-amber-100 flex-shrink-0">
    <div class="flex">
      <button id="tab-menu" onclick="setTab('menu')"
        class="flex-1 py-3 text-sm font-bold border-b-2 text-amber-600 border-amber-400 transition">
        메뉴 고르기
      </button>
      <button id="tab-friends" onclick="setTab('friends')"
        class="flex-1 py-3 text-sm font-bold border-b-2 text-gray-400 border-transparent transition flex items-center justify-center gap-1.5">
        친구들 장바구니
        <span id="friends-badge" class="bg-amber-100 text-amber-700 text-xs font-black px-2 py-0.5 rounded-full hidden">0</span>
      </button>
      <button id="tab-purchase" onclick="setTab('purchase')"
        class="flex-1 py-3 text-sm font-bold border-b-2 text-gray-400 border-transparent transition">
        구매 목록
      </button>
    </div>
  </div>

  <!-- Menu Panel -->
  <div id="panel-menu" class="flex-1 flex flex-col overflow-hidden">
    <div class="bg-amber-50 px-4 pt-3 pb-2 flex-shrink-0">
      <div class="relative">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-300 text-sm pointer-events-none">🔍</span>
        <input id="menu-search" type="text" placeholder="메뉴 검색..."
          oninput="setSearch(this.value)"
          class="w-full bg-white border-2 border-amber-100 rounded-2xl pl-9 pr-9 py-2.5 text-sm focus:outline-none focus:border-amber-400 transition">
        <button id="search-clear" onclick="clearSearch()"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 hover:text-gray-500 text-xl leading-none hidden transition">×</button>
      </div>
    </div>
    <div class="bg-amber-50 px-4 pb-3 flex-shrink-0">
      <div id="category-filters" class="flex gap-2 overflow-x-auto no-scrollbar pb-0.5"></div>
    </div>
    <div id="menu-list" class="flex-1 overflow-y-auto px-4 pb-6 space-y-6 pt-2"></div>
    <div id="cart-bar" class="hidden flex-shrink-0 px-4 pb-3 bg-amber-50">
      <button onclick="openCartSheet()"
        class="w-full bg-amber-400 hover:bg-amber-500 active:bg-amber-600 text-white rounded-2xl p-3.5 flex items-center justify-between shadow-md shadow-amber-200 transition">
        <span class="font-bold text-sm">🛒 <span id="cart-bar-count"></span>개 선택</span>
        <span id="cart-bar-total" class="font-black text-base"></span>
      </button>
    </div>
  </div>

  <!-- Friends Panel -->
  <div id="panel-friends" class="hidden flex-1 overflow-y-auto">
    <div id="friends-list" class="p-4 space-y-3"></div>
  </div>

  <!-- Purchase Panel -->
  <div id="panel-purchase" class="hidden flex-1 overflow-y-auto"></div>
</div>

<!-- ========== MENU MANAGEMENT MODAL ========== -->
<div id="menu-modal" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeMenuModal()"></div>
  <div class="absolute inset-x-0 bottom-0 bg-white rounded-t-3xl flex flex-col modal-sheet" style="max-height:90dvh;">
    <!-- Modal header -->
    <div class="flex-shrink-0 flex items-center justify-between px-5 pt-5 pb-4 border-b border-gray-100">
      <h2 class="font-black text-gray-800 text-lg">✏️ 메뉴 관리</h2>
      <button onclick="closeMenuModal()" class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-gray-600 text-2xl leading-none transition">×</button>
    </div>
    <!-- Modal sub-tabs -->
    <div class="flex-shrink-0 flex border-b border-gray-100">
      <button id="modal-tab-list" onclick="setModalTab('list')"
        class="flex-1 py-2.5 text-sm font-bold text-amber-600 border-b-2 border-amber-400 transition">
        목록 수정
      </button>
      <button id="modal-tab-add" onclick="setModalTab('add')"
        class="flex-1 py-2.5 text-sm font-bold text-gray-400 border-b-2 border-transparent transition">
        + 메뉴 추가
      </button>
    </div>
    <!-- Search bar (list tab only, sticky) -->
    <div id="modal-search-bar" class="flex-shrink-0 hidden px-4 py-2.5 bg-white border-b border-gray-100">
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-300 text-base">🔍</span>
        <input id="modal-search-input" type="text" placeholder="메뉴 이름으로 검색"
          oninput="setModalSearch(this.value)"
          class="w-full pl-8 pr-8 py-2.5 border-2 border-amber-200 rounded-xl text-sm focus:outline-none focus:border-amber-400 bg-gray-50">
        <button id="modal-search-clear" onclick="setModalSearch('')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 hover:text-gray-500 text-xl leading-none hidden">×</button>
      </div>
    </div>
    <!-- Modal content -->
    <div id="modal-content" class="flex-1 overflow-y-auto"></div>
  </div>
</div>

<!-- ========== CART SHEET ========== -->
<div id="cart-sheet" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeCartSheet()"></div>
  <div class="absolute inset-x-0 bottom-0 bg-white rounded-t-3xl flex flex-col modal-sheet" style="max-height:80dvh;">
    <div class="flex-shrink-0 flex items-center justify-between px-5 pt-5 pb-4 border-b border-gray-100">
      <h2 class="font-black text-gray-800 text-lg">🛒 내 장바구니</h2>
      <button onclick="closeCartSheet()" class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-gray-600 text-2xl leading-none transition">×</button>
    </div>
    <div id="cart-sheet-content" class="flex-1 overflow-y-auto"></div>
    <div class="flex-shrink-0 px-5 py-4 border-t border-gray-100 bg-white" style="padding-bottom: max(env(safe-area-inset-bottom), 16px);">
      <div class="flex justify-between items-center">
        <span class="font-bold text-gray-500 text-sm">합계</span>
        <span id="cart-sheet-total" class="font-black text-amber-600 text-xl"></span>
      </div>
    </div>
  </div>
</div>

<!-- ========== TOAST ========== -->
<div id="toast-container" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 space-y-2 pointer-events-none flex flex-col items-center"></div>

const BASE_ITEM_MAP = Object.fromEntries(BASE_MENU.flatMap(c => c.items).map(i => [i.id, i]));
const ITEM_CAT_MAP  = Object.fromEntries(BASE_MENU.flatMap(c => c.items.map(i => [i.id, c.id])));
const CATEGORY_LOCATIONS = {
  signature:'본점', regular:'본점', loaf:'본점', fried:'본점', pastry:'본점',
  healthy:'본점', dessert:'본점', traditional:'본점', mealkit:'본점', seasonal:'본점',
  cake:'부띠끄', roll:'부띠끄', sandwich:'샌드위치 정거장',
};
const LOCATIONS = ['본점', '부띠끄', '샌드위치 정거장'];
const LOCATION_EMOJI = { '본점':'🏠', '부띠끄':'🎂', '샌드위치 정거장':'🥪' };

  modalTab: 'list',

  modalSearch: '',
};

// ==================== EFFECTIVE MENU ====================
function getEffectiveMenu() {
  const { customItems = [], overrides = {}, hidden = [] } = S.menuChanges;
  return BASE_MENU.map(cat => ({
    ...cat,
    items: [
      ...cat.items
        .filter(i => !hidden.includes(i.id))
        .map(i => overrides[i.id] ? { ...i, ...overrides[i.id] } : i),
      ...customItems.filter(i => i.catId === cat.id)
    ]
  })).filter(cat => cat.items.length > 0);
}

function getEffectiveItemMap() {
  const { customItems = [], overrides = {} } = S.menuChanges;
  const map = {};
  for (const [id, item] of Object.entries(BASE_ITEM_MAP)) {
    const defaultLocation = CATEGORY_LOCATIONS[ITEM_CAT_MAP[id]] || '본점';
    const override = overrides[id];
    map[id] = override
      ? { ...item, ...override, location: override.location || defaultLocation }
      : { ...item, location: defaultLocation };
  }
  for (const item of customItems)
    map[item.id] = { ...item, location: item.location || CATEGORY_LOCATIONS[item.catId] || '본점' };
  return map;
}

// ==================== UTILS ====================
const fmt = n => (n || 0).toLocaleString('ko-KR') + '원';
const fmtPrice = p => (p != null && p > 0) ? p.toLocaleString('ko-KR') + '원' : '-';

function calcTotal(items) {
  const imap = getEffectiveItemMap();
  return Object.entries(items).reduce((s, [id, q]) => s + (imap[id]?.price ?? BASE_ITEM_MAP[id]?.price ?? 0) * q, 0);
}

function genCode() { return Math.random().toString(36).slice(2, 8).toUpperCase(); }
function genId()   { return Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

const AVATAR_COLORS = [
  'bg-rose-400','bg-orange-400','bg-amber-500','bg-lime-500',
  'bg-teal-400','bg-cyan-500','bg-blue-400','bg-violet-400','bg-pink-400'
];
function avatarColor(name) {
  let h = 0;
  for (const c of name) h = (h << 5) - h + c.charCodeAt(0);
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}
function avatar(name, sz = 'w-9 h-9', tx = 'text-sm') {
  return `<div class="${sz} rounded-full ${avatarColor(name)} border-2 border-white flex items-center justify-center text-white font-black ${tx} shadow-sm flex-shrink-0" title="${name}">${name[0]}</div>`;
}

// ==================== WEBSOCKET ====================
function connect(roomCode, userId, name, budget) {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}`);
  S.ws = ws;
  ws.onopen = () => {
    setConnected(true);
    ws.send(JSON.stringify({ type: 'join', roomCode, userId, name, budget }));
  };
  ws.onmessage = e => onServerMsg(JSON.parse(e.data));
  ws.onclose = () => { setConnected(false); setTimeout(() => connect(roomCode, userId, name, budget), 3000); };
  ws.onerror = () => ws.close();
}

function setConnected(yes) {
  const dot = document.getElementById('conn-dot');
  if (!dot) return;
  dot.className = yes
    ? 'live-dot w-2 h-2 rounded-full bg-green-300 inline-block'
    : 'w-2 h-2 rounded-full bg-white/30 inline-block';
}

function wsend(data) {
  if (S.ws?.readyState === WebSocket.OPEN) S.ws.send(JSON.stringify(data));
}

function onServerMsg(msg) {
  switch (msg.type) {
    case 'state': {
      S.friends = {};
      let restored = false;
      for (const [uid, u] of Object.entries(msg.room.users)) {
        if (uid !== S.myId) {
          S.friends[uid] = { ...u, isOnline: u.isOnline !== false };
        } else if (u.items && Object.keys(u.items).length > 0) {
          S.myItems = u.items;
          restored = true;
        }
      }
      if (msg.room.menu) S.menuChanges = msg.room.menu;
      renderAll();
      if (restored) toast('🛒 이전 장바구니를 불러왔어요!');
      break;
    }
    case 'userJoined':
      if (msg.userId !== S.myId) {
        for (const [uid, u] of Object.entries(S.friends)) {
          if (u.name === msg.user.name && u.isOnline === false) delete S.friends[uid];
        }
        S.friends[msg.userId] = { ...msg.user, isOnline: true };
        renderAll();
        toast(`${msg.user.name}님이 참여했어요! 👋`);
      }
      break;
    case 'itemsUpdated':
      if (S.friends[msg.userId]) { S.friends[msg.userId].items = msg.items; renderMenuList(); renderFriendsList(); renderPurchaseList(); }
      break;
    case 'budgetUpdated':
      if (S.friends[msg.userId]) { S.friends[msg.userId].budget = msg.budget; renderFriendsList(); }
      break;
    case 'userLeft': {
      const name = S.friends[msg.userId]?.name;
      if (S.friends[msg.userId]) S.friends[msg.userId].isOnline = false;
      renderAll();
      if (name) toast(`${name}님이 나갔어요`);
      break;
    }
    case 'menuUpdated':
      S.menuChanges = msg.menu;
      renderMenuList();
      renderFriendsList();
      if (document.getElementById('menu-modal') && !document.getElementById('menu-modal').classList.contains('hidden')) {
        renderModalContent();
      }
      break;
  }
}

function pushMenuChange() {
  wsend({ type: 'updateMenu', menu: S.menuChanges });
}

// ==================== LANDING ====================
function setBudgetPreset(v) { document.getElementById('input-budget').value = v; }

function getLandingInputs() {
  const name = document.getElementById('input-name').value.trim();
  const budget = parseInt(document.getElementById('input-budget').value) || 0;
  const err = document.getElementById('landing-error');
  if (!name) { err.textContent = '이름을 입력해주세요 😊'; err.classList.remove('hidden'); document.getElementById('input-name').focus(); return null; }
  err.classList.add('hidden');
  return { name, budget };
}

function createRoom() { const i = getLandingInputs(); if (i) enterRoom(i.name, i.budget, genCode()); }

function joinRoom() {
  const i = getLandingInputs(); if (!i) return;
  const code = document.getElementById('input-roomcode').value.trim().toUpperCase();
  if (code.length < 4) { const e = document.getElementById('landing-error'); e.textContent = '방 코드를 입력해주세요'; e.classList.remove('hidden'); return; }
  enterRoom(i.name, i.budget, code);
}

function enterRoom(name, budget, roomCode) {
  S.myId = genId(); S.myName = name; S.myBudget = budget;
  S.roomCode = roomCode; S.myItems = {}; S.friends = {};
  S.menuChanges = { customItems: [], overrides: {}, hidden: [] };
  localStorage.setItem('ss_session', JSON.stringify({ name, budget, roomCode }));
  document.getElementById('landing-screen').classList.add('hidden');
  document.getElementById('main-screen').classList.remove('hidden');
  document.getElementById('room-code-btn').textContent = roomCode;
  history.replaceState(null, '', `#${roomCode}`);
  connect(roomCode, S.myId, name, budget);
  renderCategoryFilters();
  renderMenuList();
  renderBudgetBar();
  renderUsersAvatars();
}

// ==================== RENDER ====================
function renderAll() {
  renderUsersAvatars(); renderBudgetBar();
  renderMenuList(); renderFriendsList(); updateFriendsBadge();
  updateCartBar(); renderPurchaseList();
}

function renderUsersAvatars() {
  const el = document.getElementById('users-avatars'); if (!el) return;
  const all = [{ name: S.myName }, ...Object.values(S.friends).filter(u => u.isOnline !== false).map(u => ({ name: u.name }))];
  el.innerHTML = all.map(u => avatar(u.name)).join('');
}

function renderBudgetBar() {
  const total = calcTotal(S.myItems);
  const budget = S.myBudget;
  const over = budget > 0 && total > budget;
  const pct = budget > 0 ? Math.min((total / budget) * 100, 100) : 0;
  const totalEl = document.getElementById('my-total-display');
  if (!totalEl) return;
  totalEl.textContent = fmt(total);
  document.getElementById('budget-bar').style.width = pct + '%';
  document.getElementById('budget-bar').className = `h-full rounded-full transition-all duration-500 ${over ? 'bg-red-300' : 'bg-white'}`;
  document.getElementById('my-budget-display').textContent = budget > 0 ? `예산: ${fmt(budget)}` : '예산: 설정 안 함';
  const statusEl = document.getElementById('budget-status');
  if (over) { statusEl.textContent = `⚠ ${fmt(total - budget)} 초과`; statusEl.className = 'text-xs text-red-200 font-bold'; }
  else if (budget > 0) { statusEl.textContent = `✓ ${fmt(budget - total)} 남음`; statusEl.className = 'text-xs text-amber-100'; }
  else statusEl.textContent = '';
}

function renderCategoryFilters() {
  const el = document.getElementById('category-filters'); if (!el) return;
  const cats = [{ id: 'all', name: '전체' }, ...getEffectiveMenu()];
  el.innerHTML = cats.map(c => {
    const active = S.category === c.id;
    return `<button onclick="setCategory('${c.id}')"
      class="flex-shrink-0 px-4 py-2 rounded-full text-xs font-black transition whitespace-nowrap
             ${active ? 'bg-amber-400 text-white shadow-md shadow-amber-200' : 'bg-white text-amber-700 border border-amber-100 hover:border-amber-300'}">
      ${c.name}
    </button>`;
  }).join('');
}

function renderMenuList() {
  const el = document.getElementById('menu-list'); if (!el) return;
  const menu = getEffectiveMenu();
  let cats;
  if (S.searchQuery) {
    const q = S.searchQuery.toLowerCase();
    cats = menu.map(cat => ({
      ...cat,
      items: cat.items.filter(i => i.name.toLowerCase().includes(q) || (i.desc || '').toLowerCase().includes(q))
    })).filter(cat => cat.items.length > 0);
  } else {
    cats = S.category === 'all' ? menu : menu.filter(c => c.id === S.category);
  }
  const emptyMsg = S.searchQuery
    ? `<div class="text-center text-amber-300 py-10 text-sm">"${S.searchQuery}" 검색 결과가 없어요</div>`
    : '<div class="text-center text-amber-300 py-10 text-sm">이 카테고리에 메뉴가 없어요<br>메뉴 관리에서 추가해보세요 ✏️</div>';
  el.innerHTML = cats.map(cat => `
    <div>
      <h3 class="font-black text-amber-900 text-sm mb-2.5">${cat.name}</h3>
      <div class="space-y-2">${cat.items.map(renderItemCard).join('')}</div>
    </div>
  `).join('') || emptyMsg;
}

function renderItemCard(item) {
  const qty = S.myItems[item.id] || 0;
  const selected = qty > 0;
  const friendsWithItem = Object.values(S.friends).filter(u => (u.items[item.id] || 0) > 0);
  const friendAvatars = friendsWithItem.map(u =>
    `<div class="w-5 h-5 rounded-full ${avatarColor(u.name)} border border-white flex items-center justify-center text-white font-black text-xs" title="${u.name}">${u.name[0]}</div>`
  ).join('');
  const tagBadge = item.tag ? `<span class="tag-badge bg-amber-100 text-amber-600">${item.tag}</span>` : '';
  return `
    <div id="menu-item-${item.id}" class="item-card bg-white rounded-2xl border-2 transition cursor-pointer select-none
                ${selected ? 'border-amber-300 item-selected' : 'border-transparent shadow-sm hover:border-amber-100'}"
         onclick="toggleItem('${item.id}')">
      <div class="flex items-center gap-3 p-3.5">
        <div class="text-3xl leading-none">${item.emoji || '🍞'}</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-1.5 flex-wrap">
            <span class="font-bold text-gray-800 text-sm">${item.name}</span>
            ${tagBadge}
            ${item.desc ? `<span class="text-xs text-amber-500 bg-amber-50 px-2 py-px rounded-full font-bold">${item.desc}</span>` : ''}
          </div>
          <div class="flex items-center gap-2 mt-0.5">
            <span class="font-black text-amber-500 text-sm">${fmtPrice(item.price)}</span>
            ${friendAvatars ? `<div class="flex -space-x-1">${friendAvatars}</div>` : ''}
          </div>
        </div>
        ${selected
          ? `<div class="flex items-center gap-2" onclick="event.stopPropagation()">
               <button onclick="changeQty('${item.id}',-1)" class="w-8 h-8 rounded-full bg-amber-100 text-amber-700 font-black text-lg flex items-center justify-center hover:bg-amber-200 active:bg-amber-300 transition leading-none">−</button>
               <span class="font-black text-gray-800 text-sm w-5 text-center">${qty}</span>
               <button onclick="changeQty('${item.id}',1)"  class="w-8 h-8 rounded-full bg-amber-400 text-white font-black text-lg flex items-center justify-center hover:bg-amber-500 active:bg-amber-600 transition leading-none">+</button>
             </div>`
          : `<div class="w-7 h-7 rounded-full border-2 border-amber-100 flex items-center justify-center flex-shrink-0">
               <div class="w-3 h-3 rounded-full bg-amber-100"></div>
             </div>`
        }
      </div>
    </div>`;
}

function renderFriendsList() {
  const el = document.getElementById('friends-list'); if (!el) return;
  const imap = getEffectiveItemMap();
  const all = [
    { id: S.myId, name: S.myName, budget: S.myBudget, items: S.myItems, isMe: true },
    ...Object.entries(S.friends).map(([id, u]) => ({ id, ...u, isMe: false }))
  ];
  el.innerHTML = all.map(user => {
    const total = calcTotal(user.items);
    const over = user.budget > 0 && total > user.budget;
    const pct = user.budget > 0 ? Math.min((total / user.budget) * 100, 100) : 0;
    const selectedItems = Object.entries(user.items)
      .filter(([, q]) => q > 0)
      .map(([id, qty]) => ({ ...(imap[id] || BASE_ITEM_MAP[id] || { name: id, price: 0, emoji: '🍞' }), qty }));

    const itemsHTML = selectedItems.map(item => {
      const subtotal = (item.price && item.price > 0) ? item.price * item.qty : null;
      if (user.isMe) {
        return `<div class="flex items-center gap-2 py-1.5 border-b border-gray-50 last:border-0">
          <span class="flex-1 text-sm text-gray-700 truncate min-w-0 cursor-pointer hover:text-amber-600 transition" onclick="goToMenuItem('${item.id}')">${item.emoji || '🍞'} ${item.name}</span>
          <div class="flex items-center gap-1.5 flex-shrink-0">
            <button onclick="changeQty('${item.id}',-1)" class="w-7 h-7 rounded-full bg-gray-100 hover:bg-red-50 text-gray-500 hover:text-red-400 font-black text-base flex items-center justify-center transition leading-none">−</button>
            <span class="font-black text-gray-700 text-xs w-4 text-center">${item.qty}</span>
            <button onclick="changeQty('${item.id}',1)" class="w-7 h-7 rounded-full bg-amber-100 hover:bg-amber-200 text-amber-700 font-black text-base flex items-center justify-center transition leading-none">+</button>
            <span class="font-bold text-amber-600 text-sm w-14 text-right flex-shrink-0">${subtotal !== null ? fmtPrice(subtotal) : '-'}</span>
            <button onclick="deleteItem('${item.id}')" class="w-7 h-7 rounded-full bg-red-50 hover:bg-red-100 text-red-400 flex items-center justify-center transition text-sm leading-none">🗑</button>
          </div>
        </div>`;
      }
      return `<div class="flex items-center justify-between text-sm py-0.5">
        <span class="text-gray-600 truncate cursor-pointer hover:text-amber-600 transition" onclick="goToMenuItem('${item.id}')">${item.emoji || '🍞'} ${item.name} <span class="text-gray-400 font-bold">× ${item.qty}</span></span>
        <span class="font-bold text-amber-600 flex-shrink-0 ml-2">${subtotal !== null ? fmtPrice(subtotal) : '-'}</span>
      </div>`;
    }).join('');

    return `
      <div class="bg-white rounded-2xl p-4 shadow-sm border-2 ${user.isMe ? 'border-amber-200' : user.isOnline === false ? 'border-gray-100 opacity-60' : 'border-transparent'}">
        <div class="flex items-center gap-3 mb-3">
          ${avatar(user.name, 'w-10 h-10', 'text-base')}
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="font-black text-gray-800 text-sm">${user.name}</span>
              ${user.isMe ? '<span class="text-xs bg-amber-100 text-amber-700 px-2 py-px rounded-full font-black">나</span>' : ''}
              ${!user.isMe && user.isOnline === false ? '<span class="text-xs bg-gray-100 text-gray-400 px-2 py-px rounded-full font-black">나감</span>' : ''}
            </div>
            <div class="text-xs text-gray-400 mt-0.5">${selectedItems.length}개 선택</div>
          </div>
          <div class="text-right">
            <div class="font-black ${over ? 'text-red-500' : 'text-amber-600'}">${fmt(total)}</div>
            ${over ? `<div class="text-xs text-red-400 font-bold">+${fmt(total - user.budget)}</div>` : ''}
          </div>
        </div>
        ${user.budget > 0 ? `<div class="bg-gray-100 rounded-full h-1.5 mb-3 overflow-hidden"><div class="h-full rounded-full transition-all duration-500 ${over ? 'bg-red-400' : 'bg-amber-400'}" style="width:${pct}%"></div></div>` : ''}
        ${selectedItems.length > 0
          ? `<div>${itemsHTML}</div>`
          : `<div class="text-center text-gray-300 text-sm py-1">아직 선택한 빵이 없어요</div>`
        }
      </div>`;
  }).join('');
}

function updateFriendsBadge() {
  const badge = document.getElementById('friends-badge'); if (!badge) return;
  const n = Object.keys(S.friends).length;
  badge.textContent = n; badge.classList.toggle('hidden', n === 0);
}

// ==================== ACTIONS ====================
function toggleItem(id) {
  if (S.myItems[id]) delete S.myItems[id]; else S.myItems[id] = 1;
  renderMenuList(); renderBudgetBar(); renderFriendsList();
  updateCartBar(); renderPurchaseList();
  wsend({ type: 'updateItems', items: S.myItems });
}

function changeQty(id, delta) {
  const n = (S.myItems[id] || 0) + delta;
  if (n <= 0) delete S.myItems[id]; else S.myItems[id] = Math.min(n, 99);
  renderMenuList(); renderBudgetBar(); renderFriendsList();
  updateCartBar(); renderPurchaseList();
  wsend({ type: 'updateItems', items: S.myItems });
}

function setTab(tab) {
  S.tab = tab;
  document.getElementById('panel-menu').classList.toggle('hidden', tab !== 'menu');
  document.getElementById('panel-friends').classList.toggle('hidden', tab !== 'friends');
  document.getElementById('panel-purchase').classList.toggle('hidden', tab !== 'purchase');
  const active = 'flex-1 py-3 text-sm font-bold border-b-2 text-amber-600 border-amber-400 transition';
  const inact  = 'flex-1 py-3 text-sm font-bold border-b-2 text-gray-400 border-transparent transition flex items-center justify-center gap-1.5';
  document.getElementById('tab-menu').className     = tab === 'menu'     ? active : inact;
  document.getElementById('tab-friends').className  = tab === 'friends'  ? active : inact;
  document.getElementById('tab-purchase').className = tab === 'purchase' ? active : inact;
  const badge = document.getElementById('friends-badge');
  if (badge && !document.getElementById('tab-friends').contains(badge))
    document.getElementById('tab-friends').appendChild(badge);
}

function setCategory(id) {
  S.category = id; renderCategoryFilters(); renderMenuList();
}

function setSearch(query) {
  S.searchQuery = query.trim();
  document.getElementById('search-clear').classList.toggle('hidden', !S.searchQuery);
  renderMenuList();
}

function clearSearch() {
  S.searchQuery = '';
  document.getElementById('menu-search').value = '';
  document.getElementById('search-clear').classList.add('hidden');
  renderMenuList();
}

function leaveRoom() {
  localStorage.removeItem('ss_session');
  if (S.ws) { S.ws.onclose = null; S.ws.close(); S.ws = null; }
  history.replaceState(null, '', location.pathname);
  document.getElementById('main-screen').classList.add('hidden');
  document.getElementById('landing-screen').classList.remove('hidden');
  document.getElementById('input-name').value = S.myName || '';
  document.getElementById('input-budget').value = S.myBudget || '';
  document.getElementById('input-roomcode').value = '';
}

function copyShareLink() {
  navigator.clipboard.writeText(`${location.origin}${location.pathname}#${S.roomCode}`).then(() => {
    const el = document.getElementById('copy-toast');
    el.style.opacity = '1';
    setTimeout(() => el.style.opacity = '0', 2000);
  });
}

// ==================== MENU MANAGEMENT MODAL ====================
function openMenuModal() {
  S.editingItemId = null;
  S.modalSearch = '';
  document.getElementById('menu-modal').classList.remove('hidden');
  renderModalContent();
}

function closeMenuModal() {
  S.modalSearch = '';
  document.getElementById('menu-modal').classList.add('hidden');
}

function setModalTab(tab) {
  S.modalSearch = '';
  S.modalTab = tab;
  const active = 'flex-1 py-2.5 text-sm font-bold text-amber-600 border-b-2 border-amber-400 transition';
  const inact  = 'flex-1 py-2.5 text-sm font-bold text-gray-400 border-b-2 border-transparent transition';
  document.getElementById('modal-tab-list').className = tab === 'list' ? active : inact;
  document.getElementById('modal-tab-add').className  = tab === 'add'  ? active : inact;
  renderModalContent();
}

function renderModalContent() {
  const el = document.getElementById('modal-content'); if (!el) return;
  const searchBar = document.getElementById('modal-search-bar');
  if (S.modalTab === 'list') {
    if (searchBar) searchBar.classList.remove('hidden');
    const inp = document.getElementById('modal-search-input');
    if (inp) inp.value = S.modalSearch;
    const clr = document.getElementById('modal-search-clear');
    if (clr) clr.classList.toggle('hidden', !S.modalSearch);
    el.innerHTML = renderModalList();
  } else {
    if (searchBar) searchBar.classList.add('hidden');
    el.innerHTML = renderModalAddForm();
  }
}

function setModalSearch(q) {
  S.modalSearch = q;
  const clr = document.getElementById('modal-search-clear');
  if (clr) clr.classList.toggle('hidden', !q);
  const el = document.getElementById('modal-content');
  if (el) el.innerHTML = renderModalList();
}

function renderModalList() {
  const { overrides = {}, hidden = [], customItems = [] } = S.menuChanges;
  const menu = BASE_MENU;
  const q = S.modalSearch.trim().toLowerCase();

  const catHTML = menu.map(cat => {
    const filteredItems = q
      ? cat.items.filter(item => {
          const eff = overrides[item.id] ? { ...item, ...overrides[item.id] } : item;
          return eff.name.toLowerCase().includes(q) || item.id === S.editingItemId;
        })
      : cat.items;
    if (!filteredItems.length) return '';
    const items = filteredItems.map(item => {
      const eff = overrides[item.id] ? { ...item, ...overrides[item.id] } : item;
      const isHidden = hidden.includes(item.id);
      const isEditing = S.editingItemId === item.id;

      const effLocation = overrides[item.id]?.location || CATEGORY_LOCATIONS[cat.id] || '본점';
      const editForm = isEditing ? `
        <div class="mt-3 pt-3 border-t border-amber-100 space-y-2" onclick="event.stopPropagation()">
          <div class="flex gap-2">
            <input id="edit-emoji-${item.id}" value="${eff.emoji || '🍞'}" maxlength="4"
              class="w-14 border-2 border-amber-200 rounded-xl px-2 py-2 text-center text-xl focus:outline-none focus:border-amber-400">
            <input id="edit-name-${item.id}" value="${eff.name}" placeholder="이름"
              class="flex-1 border-2 border-amber-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
          </div>
          <div class="flex gap-2 items-center">
            <input id="edit-price-${item.id}" type="number" value="${eff.price}" placeholder="가격"
              class="flex-1 border-2 border-amber-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
            <span class="text-sm text-gray-400 font-bold flex-shrink-0">원</span>
          </div>
          <input id="edit-desc-${item.id}" value="${eff.desc || ''}" placeholder="설명 (선택)"
            class="w-full border-2 border-amber-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
          <select id="edit-location-${item.id}" class="w-full border-2 border-amber-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-400 bg-white">
            ${LOCATIONS.map(l => `<option value="${l}" ${effLocation===l?'selected':''}>${LOCATION_EMOJI[l]} ${l}</option>`).join('')}
          </select>
          <div class="flex gap-2">
            <button onclick="saveItemEdit('${item.id}')"
              class="flex-1 bg-amber-400 hover:bg-amber-500 text-white font-black py-2 rounded-xl text-sm transition">저장</button>
            <button onclick="cancelEdit()"
              class="px-4 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2 rounded-xl text-sm transition">취소</button>
            ${overrides[item.id] ? `<button onclick="resetItem('${item.id}')" class="px-3 bg-red-50 hover:bg-red-100 text-red-400 font-bold py-2 rounded-xl text-xs transition">원복</button>` : ''}
          </div>
        </div>` : '';

      return `
        <div class="flex items-center gap-2 py-2.5 border-b border-gray-50 last:border-0 ${isHidden ? 'hidden-item' : ''}">
          <span class="text-xl w-7 text-center flex-shrink-0">${eff.emoji || '🍞'}</span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="text-sm font-bold text-gray-800 ${isHidden ? 'line-through' : ''}">${eff.name}</span>
              ${overrides[item.id] ? '<span class="tag-badge bg-blue-100 text-blue-500">수정됨</span>' : ''}
            </div>
            <span class="text-xs text-amber-500 font-bold">${fmt(eff.price)}</span>
            ${isEditing ? editForm : ''}
          </div>
          ${!isEditing ? `
            <button onclick="startEdit('${item.id}')"
              class="flex-shrink-0 text-xs bg-gray-100 hover:bg-amber-100 text-gray-500 hover:text-amber-700 px-2.5 py-1.5 rounded-lg font-bold transition">수정</button>
            <button onclick="toggleHide('${item.id}')"
              class="flex-shrink-0 text-xs px-2.5 py-1.5 rounded-lg font-bold transition ${isHidden ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' : 'bg-gray-100 text-gray-400 hover:bg-red-50 hover:text-red-400'}">
              ${isHidden ? '보이기' : '숨기기'}
            </button>` : ''}
        </div>`;
    }).join('');

    return `
      <div class="mb-1">
        <div class="px-5 py-2 bg-amber-50 text-xs font-black text-amber-700 uppercase tracking-wide">${cat.name}</div>
        <div class="px-5">${items}</div>
      </div>`;
  }).join('');

  // Custom items
  const filteredCustom = q ? customItems.filter(i => i.name.toLowerCase().includes(q) || i.id === S.editingItemId) : customItems;
  const customHTML = filteredCustom.length > 0 ? `
    <div class="mb-1">
      <div class="px-5 py-2 bg-green-50 text-xs font-black text-green-700 uppercase tracking-wide">➕ 사용자 추가 메뉴</div>
      <div class="px-5">${filteredCustom.map(item => {
        const isEditing = S.editingItemId === item.id;
        const editForm = isEditing ? `
          <div class="mt-2 space-y-2">
            <div class="flex gap-2">
              <input id="edit-emoji-${item.id}" value="${item.emoji || '🍞'}" maxlength="4"
                class="w-14 border border-gray-200 rounded-lg px-2 py-1.5 text-center text-lg focus:outline-none focus:ring-2 focus:ring-amber-300">
              <input id="edit-name-${item.id}" value="${item.name}" placeholder="이름"
                class="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-300">
              <input id="edit-price-${item.id}" type="number" value="${item.price || ''}" placeholder="가격"
                class="w-24 border border-gray-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-300">
            </div>
            <input id="edit-desc-${item.id}" value="${item.desc || ''}" placeholder="설명 (선택)"
              class="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-300">
            <select id="edit-location-${item.id}" class="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-300 bg-white">
              ${LOCATIONS.map(l => `<option value="${l}" ${(item.location||CATEGORY_LOCATIONS[item.catId]||'본점')===l?'selected':''}>${LOCATION_EMOJI[l]} ${l}</option>`).join('')}
            </select>
            <div class="flex gap-2">
              <button onclick="saveItemEdit('${item.id}')" class="flex-1 bg-amber-400 hover:bg-amber-500 text-white font-black rounded-lg py-1.5 text-sm transition">저장</button>
              <button onclick="cancelEdit()" class="px-4 bg-gray-100 hover:bg-gray-200 text-gray-500 font-bold rounded-lg py-1.5 text-sm transition">취소</button>
            </div>
          </div>` : '';
        return `
        <div class="py-2.5 border-b border-gray-50 last:border-0">
          <div class="flex items-center gap-2">
            <span class="text-xl w-7 text-center flex-shrink-0">${item.emoji || '🍞'}</span>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-bold text-gray-800">${item.name}</div>
              <span class="text-xs text-amber-500 font-bold">${fmt(item.price)}</span>
              <span class="text-xs text-gray-400 ml-1">${BASE_MENU.find(c=>c.id===item.catId)?.name || item.catId}</span>
            </div>
            <button onclick="startEdit('${item.id}')"
              class="flex-shrink-0 text-xs bg-gray-100 hover:bg-amber-100 text-gray-500 hover:text-amber-700 px-2.5 py-1.5 rounded-lg font-bold transition">수정</button>
            <button onclick="removeCustomItem('${item.id}')"
              class="flex-shrink-0 text-xs bg-red-50 hover:bg-red-100 text-red-400 px-2.5 py-1.5 rounded-lg font-bold transition">삭제</button>
          </div>
          ${editForm}
        </div>`;
      }).join('')}
      </div>
    </div>` : '';

  const hiddenCount = hidden.length;
  const modifiedCount = Object.keys(S.menuChanges.overrides || {}).length;
  const customCount = customItems.length;

  const noResults = q && !catHTML.replace(/\s/g,'') && !filteredCustom.length;

  return `
    <div class="px-5 py-2 bg-gray-50 flex gap-3 text-xs text-gray-500">
      <span>숨김: <b class="text-gray-700">${hiddenCount}</b>개</span>
      <span>수정: <b class="text-gray-700">${modifiedCount}</b>개</span>
      <span>추가: <b class="text-gray-700">${customCount}</b>개</span>
      ${(hiddenCount + modifiedCount + customCount > 0) ? `<button onclick="resetAllMenu()" class="ml-auto text-red-400 hover:text-red-600 font-bold transition">전체 초기화</button>` : ''}
    </div>
    ${noResults ? '<div class="text-center text-gray-300 py-10 text-sm">검색 결과가 없어요</div>' : ''}
    ${customHTML}
    ${catHTML}`;
}

function renderModalAddForm() {
  const catOptions = BASE_MENU.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  return `
    <div class="p-5 space-y-4">
      <p class="text-xs text-gray-400">새로운 메뉴를 추가하면 방 안의 모든 사람에게 공유됩니다.</p>
      <div class="flex gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">이모지</label>
          <input id="add-emoji" value="🍞" maxlength="4"
            class="w-16 border-2 border-amber-100 rounded-2xl px-2 py-3 text-center text-2xl focus:outline-none focus:border-amber-400">
        </div>
        <div class="flex-1">
          <label class="block text-xs font-bold text-gray-500 mb-1">메뉴 이름 <span class="text-red-400">*</span></label>
          <input id="add-name" type="text" placeholder="예) 새우바게트" maxlength="30"
            class="w-full border-2 border-amber-100 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-amber-400">
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 mb-1">가격 <span class="text-gray-300">(선택 · 없으면 - 로 표시)</span></label>
        <div class="relative">
          <input id="add-price" type="number" placeholder="미입력 가능" min="0" step="100"
            class="w-full border-2 border-amber-100 rounded-2xl px-4 py-3 pr-10 text-sm focus:outline-none focus:border-amber-400">
          <span class="absolute right-4 top-1/2 -translate-y-1/2 text-amber-500 font-bold text-sm">원</span>
        </div>
      </div>
      <div class="flex gap-3">
        <div class="flex-1">
          <label class="block text-xs font-bold text-gray-500 mb-1">카테고리</label>
          <select id="add-category" onchange="updateLocationFromCategory()"
            class="w-full border-2 border-amber-100 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-amber-400 bg-white">
            ${catOptions}
          </select>
        </div>
        <div class="flex-1">
          <label class="block text-xs font-bold text-gray-500 mb-1">판매 위치</label>
          <select id="add-location"
            class="w-full border-2 border-amber-100 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-amber-400 bg-white">
            ${LOCATIONS.map(l => `<option value="${l}">${LOCATION_EMOJI[l]} ${l}</option>`).join('')}
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 mb-1">설명 <span class="text-gray-300">(선택)</span></label>
        <input id="add-desc" type="text" placeholder="간단한 설명" maxlength="40"
          class="w-full border-2 border-amber-100 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-amber-400">
      </div>
      <p id="add-error" class="text-red-400 text-xs font-bold hidden"></p>
      <button onclick="submitAddItem()"
        class="w-full bg-amber-400 hover:bg-amber-500 active:bg-amber-600 text-white font-black py-4 rounded-2xl text-base transition shadow-md shadow-amber-200">
        ✅ 메뉴 추가하기
      </button>
    </div>`;
}

// ==================== MENU EDIT ACTIONS ====================
function startEdit(itemId) {
  S.editingItemId = itemId;
  renderModalContent();
  setTimeout(() => { const el = document.getElementById(`edit-name-${itemId}`); if (el) el.focus(); }, 50);
}

function cancelEdit() {
  S.editingItemId = null;
  renderModalContent();
}

function saveItemEdit(itemId) {
  const name     = document.getElementById(`edit-name-${itemId}`)?.value.trim();
  const price    = parseInt(document.getElementById(`edit-price-${itemId}`)?.value) || 0;
  const emoji    = document.getElementById(`edit-emoji-${itemId}`)?.value.trim() || '🍞';
  const desc     = document.getElementById(`edit-desc-${itemId}`)?.value.trim() || '';
  const location = document.getElementById(`edit-location-${itemId}`)?.value || '본점';
  if (!name) { toast('이름을 입력해주세요'); return; }
  const customIdx = S.menuChanges.customItems.findIndex(i => i.id === itemId);
  if (customIdx >= 0) {
    S.menuChanges.customItems[customIdx] = { ...S.menuChanges.customItems[customIdx], name, price, emoji, desc, location };
  } else {
    if (!S.menuChanges.overrides) S.menuChanges.overrides = {};
    S.menuChanges.overrides[itemId] = { name, price, emoji, desc, location };
  }
  S.editingItemId = null;
  pushMenuChange();
  renderMenuList();
  renderFriendsList();
  renderPurchaseList();
  renderModalContent();
  toast('✅ 수정 완료!');
}

function resetItem(itemId) {
  delete S.menuChanges.overrides[itemId];
  S.editingItemId = null;
  pushMenuChange();
  renderMenuList();
  renderPurchaseList();
  renderModalContent();
}

function toggleHide(itemId) {
  if (!S.menuChanges.hidden) S.menuChanges.hidden = [];
  const idx = S.menuChanges.hidden.indexOf(itemId);
  if (idx >= 0) S.menuChanges.hidden.splice(idx, 1);
  else S.menuChanges.hidden.push(itemId);
  // Remove from selections if hidden
  if (S.menuChanges.hidden.includes(itemId) && S.myItems[itemId]) {
    delete S.myItems[itemId];
    wsend({ type: 'updateItems', items: S.myItems });
    renderBudgetBar();
  }
  pushMenuChange();
  renderMenuList();
  renderCategoryFilters();
  renderModalContent();
}

function removeCustomItem(itemId) {
  if (!S.menuChanges.customItems) S.menuChanges.customItems = [];
  S.menuChanges.customItems = S.menuChanges.customItems.filter(i => i.id !== itemId);
  if (S.myItems[itemId]) { delete S.myItems[itemId]; wsend({ type: 'updateItems', items: S.myItems }); renderBudgetBar(); }
  pushMenuChange();
  renderMenuList();
  renderCategoryFilters();
  renderModalContent();
}

function resetAllMenu() {
  if (!confirm('모든 메뉴 변경사항을 초기화할까요?')) return;
  S.menuChanges = { customItems: [], overrides: {}, hidden: [] };
  S.editingItemId = null;
  pushMenuChange();
  renderAll();
  renderCategoryFilters();
  renderModalContent();
  toast('메뉴가 초기화되었어요');
}

function updateLocationFromCategory() {
  const catId = document.getElementById('add-category')?.value;
  const locEl = document.getElementById('add-location');
  if (locEl && catId) locEl.value = CATEGORY_LOCATIONS[catId] || '본점';
}

function submitAddItem() {
  const name  = document.getElementById('add-name')?.value.trim();
  const price = parseInt(document.getElementById('add-price')?.value) || 0;
  const emoji = document.getElementById('add-emoji')?.value.trim() || '🍞';
  const catId = document.getElementById('add-category')?.value;
  const desc  = document.getElementById('add-desc')?.value.trim() || '';
  const errEl = document.getElementById('add-error');

  if (!name) { errEl.textContent = '메뉴 이름을 입력해주세요'; errEl.classList.remove('hidden'); return; }
  errEl.classList.add('hidden');

  const location = document.getElementById('add-location')?.value || CATEGORY_LOCATIONS[catId] || '본점';
  const newItem = { id: 'custom-' + genId(), catId, name, price, emoji, desc, location };
  if (!S.menuChanges.customItems) S.menuChanges.customItems = [];
  S.menuChanges.customItems.push(newItem);
  pushMenuChange();
  renderMenuList();
  renderCategoryFilters();
  toast(`✅ "${name}" 추가 완료!`);
  setModalTab('list');
}

// ==================== CART SHEET ====================
function updateCartBar() {
  const bar = document.getElementById('cart-bar');
  if (!bar) return;
  const count = Object.values(S.myItems).reduce((s, q) => s + q, 0);
  if (count === 0) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  document.getElementById('cart-bar-count').textContent = count;
  document.getElementById('cart-bar-total').textContent = fmt(calcTotal(S.myItems)) + ' ›';
}

function openCartSheet() {
  renderCartSheet();
  document.getElementById('cart-sheet').classList.remove('hidden');
}

function closeCartSheet() {
  document.getElementById('cart-sheet').classList.add('hidden');
}

function renderCartSheet() {
  const el = document.getElementById('cart-sheet-content');
  const totalEl = document.getElementById('cart-sheet-total');
  if (!el) return;
  const imap = getEffectiveItemMap();
  const items = Object.entries(S.myItems)
    .filter(([, q]) => q > 0)
    .map(([id, qty]) => ({ ...(imap[id] || { name: id, price: 0, emoji: '🍞' }), id, qty }));
  if (totalEl) totalEl.textContent = fmt(calcTotal(S.myItems));
  if (!items.length) {
    el.innerHTML = '<div class="text-center text-gray-300 py-10 text-sm">선택한 빵이 없어요</div>';
    return;
  }
  el.innerHTML = `<div class="p-4 space-y-2">${items.map(item => {
    const subtotal = item.price ? item.price * item.qty : null;
    return `<div class="flex items-center gap-3 bg-amber-50 rounded-2xl p-3">
      <div class="flex items-center gap-3 flex-1 min-w-0 cursor-pointer" onclick="goToMenuItem('${item.id}')">
        <span class="text-2xl">${item.emoji || '🍞'}</span>
        <div class="min-w-0">
          <div class="font-bold text-gray-800 text-sm truncate">${item.name}</div>
          ${subtotal !== null ? `<div class="text-xs text-amber-500 font-bold">${fmt(subtotal)}</div>` : ''}
        </div>
      </div>
      <div class="flex items-center gap-1.5 flex-shrink-0">
        <button onclick="cartChangeQty('${item.id}',-1)" class="w-8 h-8 rounded-full bg-white text-amber-700 font-black text-lg flex items-center justify-center hover:bg-amber-100 transition shadow-sm leading-none">−</button>
        <span class="font-black text-gray-800 text-sm w-5 text-center">${item.qty}</span>
        <button onclick="cartChangeQty('${item.id}',1)" class="w-8 h-8 rounded-full bg-amber-400 text-white font-black text-lg flex items-center justify-center hover:bg-amber-500 transition leading-none">+</button>
        <button onclick="deleteItem('${item.id}')" class="w-8 h-8 rounded-full bg-red-50 text-red-400 flex items-center justify-center hover:bg-red-100 transition text-base leading-none">🗑</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function goToMenuItem(id) {
  closeCartSheet();
  setTab('menu');
  S.category = 'all';
  S.searchQuery = '';
  document.getElementById('menu-search').value = '';
  document.getElementById('search-clear').classList.add('hidden');
  renderCategoryFilters();
  renderMenuList();
  setTimeout(() => {
    const el = document.getElementById(`menu-item-${id}`);
    const container = document.getElementById('menu-list');
    if (!el || !container) return;

    el.scrollIntoView({ behavior: 'smooth', block: 'center' });

    const flash = () => {
      el.classList.add('highlight-flash');
      setTimeout(() => el.classList.remove('highlight-flash'), 1200);
    };

    let scrollTimer = setTimeout(flash, 150);
    const onScroll = () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        container.removeEventListener('scroll', onScroll);
        flash();
      }, 120);
    };
    container.addEventListener('scroll', onScroll);
  }, 100);
}

function cartChangeQty(id, delta) {
  changeQty(id, delta);
  renderCartSheet();
}

function deleteItem(id) {
  delete S.myItems[id];
  renderMenuList(); renderBudgetBar(); renderFriendsList();
  updateCartBar(); renderPurchaseList();
  renderCartSheet();
  if (Object.keys(S.myItems).length === 0) closeCartSheet();
  wsend({ type: 'updateItems', items: S.myItems });
}

// ==================== PURCHASE LIST ====================
function togglePurchaseGroup(loc) {
  S.purchaseCollapsed[loc] = !S.purchaseCollapsed[loc];
  const collapsed = S.purchaseCollapsed[loc];
  const group = document.querySelector(`[data-purchase-group="${CSS.escape(loc)}"]`);
  if (!group) return;
  const body = group.querySelector('.accordion-body');
  const chevron = group.querySelector('.accordion-chevron');
  if (body) body.style.gridTemplateRows = collapsed ? '0fr' : '1fr';
  if (chevron) chevron.style.transform = `rotate(${collapsed ? '-90' : '0'}deg)`;
}

function renderPurchaseList() {
  const el = document.getElementById('panel-purchase');
  if (!el) return;
  const imap = getEffectiveItemMap();
  const totals = {};
  const allUsers = [
    { name: S.myName, items: S.myItems },
    ...Object.values(S.friends).map(u => ({ name: u.name, items: u.items || {} }))
  ];
  for (const user of allUsers) {
    for (const [id, qty] of Object.entries(user.items)) {
      if (qty > 0) {
        if (!totals[id]) totals[id] = { qty: 0, buyers: [] };
        totals[id].qty += qty;
        totals[id].buyers.push(user.name);
      }
    }
  }
  const entries = Object.entries(totals)
    .map(([id, data]) => ({ ...(imap[id] || { name: id, price: 0, emoji: '🍞', location: '본점' }), id, ...data }))
    .filter(i => i.name)
    .sort((a, b) => b.qty - a.qty);
  if (!entries.length) {
    el.innerHTML = '<div class="text-center text-amber-300 py-10 text-sm">아직 선택된 메뉴가 없어요</div>';
    return;
  }
  const totalQty = entries.reduce((s, i) => s + i.qty, 0);
  const grandTotal = entries.reduce((s, i) => s + (i.price || 0) * i.qty, 0);

  // 위치별 그루핑
  const grouped = {};
  for (const item of entries) {
    const loc = item.location || '본점';
    if (!grouped[loc]) grouped[loc] = [];
    grouped[loc].push(item);
  }
  const sortedLocs = LOCATIONS.filter(l => grouped[l]);

  const itemCard = item => `<div class="bg-white rounded-2xl p-4 shadow-sm border border-amber-50">
    <div class="flex items-center gap-3">
      <span class="text-2xl">${item.emoji || '🍞'}</span>
      <div class="flex-1 min-w-0">
        <div class="font-bold text-gray-800 text-sm">${item.name}</div>
        <div class="text-xs text-gray-400 mt-0.5 truncate">${item.buyers.join(', ')}</div>
      </div>
      <div class="text-right">
        <div class="font-black text-amber-600 text-base">${item.qty}개</div>
        ${item.price ? `<div class="text-xs text-gray-400">${fmt(item.price * item.qty)}</div>` : ''}
      </div>
    </div>
  </div>`;

  el.innerHTML = `<div class="p-4 space-y-4">
    <div class="bg-amber-400 rounded-2xl p-4 flex justify-between items-center">
      <span class="font-black text-white">${entries.length}종류 · 총 ${totalQty}개</span>
      <span class="font-black text-white text-lg">${fmt(grandTotal)}</span>
    </div>
    ${sortedLocs.map(loc => {
      const locItems = grouped[loc];
      const locQty = locItems.reduce((s, i) => s + i.qty, 0);
      const locTotal = locItems.reduce((s, i) => s + (i.price || 0) * i.qty, 0);
      const collapsed = S.purchaseCollapsed[loc];
      return `<div data-purchase-group="${loc}">
        <button onclick="togglePurchaseGroup('${loc}')" class="w-full flex items-center justify-between px-1 mb-2 py-1 active:opacity-60 transition-opacity">
          <span class="font-black text-gray-700 text-sm">${LOCATION_EMOJI[loc]} ${loc}</span>
          <div class="flex items-center gap-2">
            <span class="text-xs text-gray-400">${locQty}개 · ${fmt(locTotal)}</span>
            <span class="accordion-chevron text-gray-400 text-xs" style="display:inline-block;transition:transform 0.28s cubic-bezier(.4,0,.2,1);transform:rotate(${collapsed ? '-90' : '0'}deg)">▼</span>
          </div>
        </button>
        <div class="accordion-body" style="display:grid;grid-template-rows:${collapsed ? '0fr' : '1fr'};transition:grid-template-rows 0.28s cubic-bezier(.4,0,.2,1);overflow:hidden;">
          <div style="overflow:hidden;min-height:0;">
            <div class="space-y-2 pb-1">${locItems.map(itemCard).join('')}</div>
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// ==================== TOAST ====================
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'bg-gray-800/90 text-white text-sm font-bold px-5 py-2.5 rounded-full shadow-lg backdrop-blur-sm transition-all duration-300';
  el.textContent = msg;
  el.style.cssText = 'opacity:0;transform:translateY(8px)';
  document.getElementById('toast-container').appendChild(el);
  requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; });
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2500);
}

// ==================== INIT ====================
(function autoRejoin() {
  const hashCode = location.hash.replace('#', '').trim();
  const saved = (() => { try { return JSON.parse(localStorage.getItem('ss_session')); } catch { return null; } })();

  // URL hash가 있고 저장된 방코드와 일치하면 자동 입장
  if (saved && saved.name && saved.roomCode) {
    const targetRoom = (hashCode && /^[A-Z0-9]{4,6}$/i.test(hashCode))
      ? hashCode.toUpperCase()
      : saved.roomCode;
    enterRoom(saved.name, saved.budget ?? 0, targetRoom);
    return;
  }

  // 자동 입장 불가 → 기존 랜딩 화면
  if (hashCode && /^[A-Z0-9]{4,6}$/i.test(hashCode)) {
    document.getElementById('input-roomcode').value = hashCode.toUpperCase();
  }
})();

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !document.getElementById('landing-screen').classList.contains('hidden')) {
    document.getElementById('input-roomcode').value.trim() ? joinRoom() : createRoom();
  }
});
</script>
